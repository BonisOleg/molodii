{% load i18n_fields %}
{% if o.photos.all %}
  <div class="office-card__media office-card__media--gallery">
    <div class="office-card__gallery">
      {% for photo in o.photos.all %}
        <figure class="office-card__figure">
          <img
            class="office-card__image office-card__image--natural"
            src="{{ photo.image.url }}"
            alt="{% t o 'city' %} — {% if LANG == 'it' %}foto {{ forloop.counter }}{% else %}фото {{ forloop.counter }}{% endif %}"
            width="1024"
            height="768"
            loading="lazy"
            decoding="async"
          >
        </figure>
      {% endfor %}
    </div>
  </div>
{% elif o.photo %}
  <div class="office-card__media">
    <img
      class="office-card__image office-card__image--natural"
      src="{{ o.photo.url }}"
      alt="{% t o 'city' %}"
      loading="lazy"
      decoding="async"
    >
  </div>
{% endif %}
