{% load i18n_fields static %}
{% with gallery=o.gallery_image_urls %}
  {% if gallery|length >= 2 %}
    <div class="office-card__media office-card__media--carousel">
      <div
        class="office-card__carousel"
        data-office-carousel
        aria-label="{% if LANG == 'it' %}Galleria foto{% else %}Галерея фото{% endif %}"
      >
        <div class="office-card__carousel-track" role="group">
          {% for src in gallery %}
            <figure class="office-card__carousel-slide{% if forloop.first %} is-active{% endif %}"{% if not forloop.first %} aria-hidden="true"{% endif %}>
              <img
                class="office-card__image"
                src="{{ src }}"
                alt="{% t o 'city' %} — {% if LANG == 'it' %}foto {{ forloop.counter }}{% else %}фото {{ forloop.counter }}{% endif %}"
                width="1024"
                height="768"
                {% if forloop.first %}loading="eager"{% else %}loading="lazy"{% endif %}
                decoding="async"
              >
            </figure>
          {% endfor %}
        </div>
        <div class="office-card__carousel-dots">
          {% for src in gallery %}
            <button
              type="button"
              class="office-card__carousel-dot{% if forloop.first %} is-active{% endif %}"
              aria-label="{% if LANG == 'it' %}Mostra foto {{ forloop.counter }}{% else %}Показати фото {{ forloop.counter }}{% endif %}"
              {% if forloop.first %}aria-current="true"{% endif %}
            ></button>
          {% endfor %}
        </div>
      </div>
    </div>
  {% elif gallery|length == 1 %}
    <div class="office-card__media">
      <img
        class="office-card__image office-card__image--natural"
        src="{{ gallery.0 }}"
        alt="{% t o 'city' %}"
        loading="lazy"
        decoding="async"
      >
    </div>
  {% elif o.photo %}
    <div class="office-card__media">
      <img
        class="office-card__image office-card__image--natural"
        src="{{ o.photo.url }}"
        alt="{% t o 'city' %}"
        loading="lazy"
        decoding="async"
      >
    </div>
  {% endif %}
{% endwith %}
