# Render Blueprint — psycholog-site
# Dashboard → Blueprints → New Blueprint Instance → підключити репозиторій → Apply.
# Суперюзер admin/admin створюється автоматично в build.sh (ensure_superuser).
# Контент сторінок: seed_demo запускається в build.sh після migrate.
# Якщо тексти порожні — вручну: python manage.py seed_demo
# Секрети (RESEND_API_KEY, DEFAULT_FROM_EMAIL) задайте в Dashboard або при створенні Blueprint.

databases:
  - name: psycholog-db
    plan: free
    databaseName: psycholog
    user: psycholog

services:
  - type: web
    name: psycholog-site
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: ./bin/web
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: project.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: psycholog-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: molodiitetiana.com,www.molodiitetiana.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://molodiitetiana.com,https://www.molodiitetiana.com
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CONTACT_RECIPIENT
        sync: false
